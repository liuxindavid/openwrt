name: Sync OpenWrt Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/openwrt/openwrt.git
          git fetch upstream
          
          git checkout -b openwrt-24.10 upstream/openwrt-24.10 || git checkout openwrt-24.10
          git reset --hard upstream/openwrt-24.10
          
          # 【核心改动】强制删除从官方同步过来的 .github 文件夹，避免触发 GitHub 的安全拦截
          git rm -rf .github --ignore-unmatch
          git commit -m "Remove upstream workflows to avoid permission issues" || true
          
          git push origin openwrt-24.10 --force
