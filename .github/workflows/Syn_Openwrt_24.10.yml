name: Sync OpenWrt Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 显式声明该工作流拥有的权限
permissions:
  contents: write    # 允许读写仓库代码
  workflows: write   # 允许更新 .github/workflows 下的工作流文件（解决当前报错）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/openwrt/openwrt.git
          git fetch upstream
          
          git checkout -b openwrt-24.10 upstream/openwrt-24.10 || git checkout openwrt-24.10
          git reset --hard upstream/openwrt-24.10
          
          git push origin openwrt-24.10 --force
