
name: Sync OpenWrt 25.12 Upstream

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-openwrt-25-12
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Sync official OpenWrt 25.12 snapshot
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ############################################
          # 1. Fetch official OpenWrt 25.12
          ############################################

          git remote add upstream https://github.com/openwrt/openwrt.git

          git fetch --depth=1 upstream \
            refs/heads/openwrt-25.12

          UPSTREAM_COMMIT=$(git rev-parse FETCH_HEAD)

          ############################################
          # 2. Create independent snapshot branch
          ############################################

          git checkout --orphan openwrt-25.12-snapshot \
            FETCH_HEAD

          ############################################
          # 3. Remove upstream GitHub workflows
          ############################################

          git rm -rf .github --ignore-unmatch

          ############################################
          # 4. Create a new root commit
          ############################################

          git add -A

          git commit -m "Sync OpenWrt 25.12 snapshot from ${UPSTREAM_COMMIT}"

          ############################################
          # 5. Verify snapshot
          ############################################

          echo "===== Snapshot branch ====="
          git branch --show-current

          echo "===== Latest commit ====="
          git log -1 --oneline

          echo "===== Root commit parent count ====="
          git rev-list --parents -n 1 HEAD

          ############################################
          # 6. Push only OpenWrt 25.12
          ############################################

          git push --force origin \
            HEAD:refs/heads/openwrt-25.12

          echo "OpenWrt 25.12 sync completed"
